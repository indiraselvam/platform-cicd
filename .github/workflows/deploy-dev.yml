name: Deploy Dev

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      environment: dev
      ecr_repository: dev-sample-app
      aws_region: ap-south-1
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  gitops:
    needs: build
    uses: ./.github/workflows/bump-gitops-image.yml
    with:
      environment: dev
      app_name: sample-app
      image_tag: ${{ needs.build.outputs.image_tag }}
      auto_merge: true
    secrets:
      GITOPS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
