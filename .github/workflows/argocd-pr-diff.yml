name: argocd-pr-diff

on:
  pull_request:
    paths:
      - "charts/**"
      - "argocd/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  diff:
    strategy:
      matrix:
        environment: [dev]

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the PR code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 2. Configure AWS using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name dev-eks

          echo "Testing EKS access..."
          kubectl get nodes

      # 4. Install Argo CD CLI
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x /usr/local/bin/argocd

          argocd version --client

      # 5. Port-forward Argo CD, then check app and diff — all in one step
      # NOTE: argocd login is skipped entirely. The CLI's login subcommand
      # was falling back to an interactive username/password prompt even
      # with --auth-token set (confirmed via direct API test that the
      # token itself is valid). Every argocd command accepts --auth-token
      # directly, so we pass it per-command instead of logging in first.
      - name: Port forward and diff Argo CD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_READONLY_TOKEN }}
        run: |
          kubectl port-forward \
            svc/argocd-server \
            8080:443 \
            -n argocd \
            > /tmp/argocd-port-forward.log 2>&1 &

          PF_PID=$!

          # Wait for the port to actually accept connections instead of a blind sleep
          for i in $(seq 1 15); do
            if curl -sk https://localhost:8080/api/v1/version > /dev/null; then
              echo "Port-forward is ready"
              break
            fi
            echo "Waiting for port-forward... ($i)"
            sleep 1
          done

          echo "===== Argo CD Port Forward Log ====="
          cat /tmp/argocd-port-forward.log

          echo "Token length: ${#ARGOCD_AUTH_TOKEN}"

          argocd app get sample-app-${{ matrix.environment }} \
            --server localhost:8080 \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

          argocd app diff sample-app-${{ matrix.environment }} \
            --server localhost:8080 \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure \
            > diff_output.txt 2>&1 || true

          echo "===== Argo CD Diff ====="
          cat diff_output.txt

          kill $PF_PID 2>/dev/null || true

      # 9. Comment diff on PR
      - name: Comment diff on PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync(
              'diff_output.txt',
              'utf8'
            ).slice(-50000) || 'No diff';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### ArgoCD diff — \`${process.env.ENVIRONMENT}\`

            \`\`\`diff
            ${diff}
            \`\`\``
            });
