name: argocd-pr-diff

on:
  pull_request:
    paths:
      - "charts/**"
      - "argocd/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  diff:
    strategy:
      matrix:
        environment: [dev]

    runs-on: ubuntu-latest

    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Install Argo CD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Login to Argo CD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_READONLY_TOKEN }}
        run: |
          argocd login localhost:8080 \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

      - name: Diff
        run: |
          argocd app diff sample-app-${{ matrix.environment }} \
            --server localhost:8080 \
            --grpc-web \
            --insecure \
            > diff_output.txt 2>&1 || true
           cat diff_output.txt

      - name: Comment diff on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('diff_output.txt', 'utf8').slice(-50000) || 'No diff';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### ArgoCD diff — \`${{ matrix.environment }}\`\n\`\`\`diff\n${diff}\n\`\`\``,
            });
