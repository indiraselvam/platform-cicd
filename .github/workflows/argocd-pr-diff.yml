name: argocd-pr-diff

on:
  pull_request:
    paths:
      - "charts/**"
      - "argocd/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  diff:
    strategy:
      matrix:
        environment: [dev]

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the PR code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # 2. Configure AWS using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 3. Configure kubectl for EKS
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name dev-eks

          echo "Testing EKS access..."
          kubectl get nodes

      # 4. Install Argo CD CLI
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x /usr/local/bin/argocd

          argocd version --client

      # 5. Port-forward Argo CD
      - name: Port forward Argo CD
        run: |
          kubectl port-forward \
            svc/argocd-server \
            8080:443 \
            -n argocd \
            > /tmp/argocd-port-forward.log 2>&1 &

          sleep 10

          echo "===== Argo CD Port Forward ====="
          cat /tmp/argocd-port-forward.log

          echo "===== Testing Argo CD ====="
          curl -k https://localhost:8080/api/v1/version

      # 6. Login to Argo CD
      - name: Login to Argo CD
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_READONLY_TOKEN }}
        run: |
          argocd login localhost:8080 \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --insecure

      # 7. Check Argo CD application
      - name: Check Argo CD application
        run: |
          argocd app get sample-app-${{ matrix.environment }} \
            --server localhost:8080 \
            --grpc-web \
            --insecure

      # 8. Generate Argo CD diff
      - name: Diff
        run: |
          argocd app diff sample-app-${{ matrix.environment }} \
            --server localhost:8080 \
            --grpc-web \
            --insecure \
            > diff_output.txt 2>&1 || true

          echo "===== Argo CD Diff ====="
          cat diff_output.txt

      # 9. Comment diff on PR
      - name: Comment diff on PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');

            const diff = fs.readFileSync(
              'diff_output.txt',
              'utf8'
            ).slice(-50000) || 'No diff';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### ArgoCD diff — \`${process.env.ENVIRONMENT}\`

            \`\`\`diff
            ${diff}
            \`\`\``
            });
